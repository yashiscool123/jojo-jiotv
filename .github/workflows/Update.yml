name: Update Playlist

on:
  workflow_dispatch:   # manual trigger
  push:
    branches:
      - main

jobs:
  update-playlist:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # allow pushing back to the same repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Links and Create New Playlist
        run: |
          python <<'EOF'
          import re
          from urllib.parse import urlparse, urlunparse

          input_file = "Ser.m3u"
          output_file = "New_Codes.m3u"

          NEW_USER = "your_new_username"
          NEW_PASS = "your_new_password"
          NEW_TOKEN = "your_new_token_if_needed"

          try:
              with open(input_file, "r", encoding="utf-8") as f:
                  lines = f.readlines()
          except FileNotFoundError:
              print(f"Error: {input_file} not found.")
              exit(1)

          new_playlist = ["#EXTM3U\n"]
          current_info = ""

          for line in lines:
              line = line.strip()
              if not line:
                  continue
              
              if line.startswith("#EXTINF"):
                  current_info = line
              elif line.startswith("http://") or line.startswith("https://"):
                  original_link = line
                  parsed_url = urlparse(original_link)
                  base_url = urlunparse((
                      parsed_url.scheme,
                      parsed_url.netloc,
                      parsed_url.path,
                      '', '', ''
                  ))
                  custom_code_link = f"{base_url}?user={NEW_USER}&pass={NEW_PASS}"
                  if current_info:
                      new_playlist.append(f"{current_info}\n")
                  new_playlist.append(f"{custom_code_link}\n")
                  current_info = "" 
              elif line.startswith("#EXTM3U"):
                  continue
              else:
                  if current_info:
                      new_playlist.append(f"{line}\n")

          with open(output_file, "w", encoding="utf-8") as f:
              f.writelines(new_playlist)
          print(f"Successfully generated {output_file} with modified authentication codes.")
          EOF

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add New_Codes.m3u
          git commit -m "Update playlist with new authentication codes" || echo "No changes to commit"
          git push
